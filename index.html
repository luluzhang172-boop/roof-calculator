<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoofQuant Pro - 2025 Professional Metal Roofing Budget & Installation Guide</title>
    <!-- Core Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .blue-gradient { background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%); }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .frosted-glass { backdrop-filter: blur(12px); background: rgba(255, 255, 255, 0.7); }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body class="antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        /** --- 1. Global Constants & Enums --- **/
        const MaterialGrade = { BASIC: 'BASIC', STANDARD: 'STANDARD', PREMIUM: 'PREMIUM' };
        const RoofShape = { GABLE: 'GABLE', HIP: 'HIP', SHED: 'SHED' };
        const RoofPitch = { FLAT: 'FLAT', STANDARD: 'STANDARD', STEEP: 'STEEP', EXTREME: 'EXTREME' };
        const InstallationType = { DIY: 'DIY', PROFESSIONAL: 'PROFESSIONAL' };
        const UnitSystem = { IMPERIAL: 'IMPERIAL', METRIC: 'METRIC' };

        const PRICING = {
            MATERIAL: {
                [MaterialGrade.BASIC]: 5.00, 
                [MaterialGrade.STANDARD]: 8.00,
                [MaterialGrade.PREMIUM]: 12.50
            },
            LABOR: {
                BASE: 7.00,
                PREMIUMS: {
                    [RoofPitch.FLAT]: 0,
                    [RoofPitch.STANDARD]: 0,
                    [RoofPitch.STEEP]: 2.00,
                    [RoofPitch.EXTREME]: 4.00
                }
            },
            ACCESSORIES_FACTOR: 0.15
        };

        const PITCH_DATA = {
            [RoofPitch.FLAT]: { label: 'Flat (2:12)', factor: 1.014 },
            [RoofPitch.STANDARD]: { label: 'Standard (6:12)', factor: 1.118 },
            [RoofPitch.STEEP]: { label: 'Steep (9:12)', factor: 1.250 },
            [RoofPitch.EXTREME]: { label: 'Extreme (12:12)', factor: 1.414 }
        };

        const SQFT_TO_SQM = 0.092903;
        const METERS_TO_FEET = 3.28084;

        /** --- 2. UI Sub-components --- **/

        const Header = () => (
            <header className="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
                <div className="flex items-center gap-3">
                    <div className="blue-gradient p-2 rounded-xl shadow-lg shadow-blue-100">
                        <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    </div>
                    <div>
                        <h1 className="text-lg font-black text-slate-900 tracking-tighter leading-none uppercase">RoofQuant <span className="text-blue-600">PRO</span></h1>
                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Metal Roofing Full-Cycle Budget Expert</p>
                    </div>
                </div>
            </header>
        );

        const InputPanel = ({ state, setState }) => {
            const set = (key, val) => setState(prev => ({ ...prev, [key]: val }));
            const setDim = (key, field, val) => {
                const n = parseFloat(val) || 0;
                setState(prev => ({ ...prev, [key]: { ...prev[key], [field]: n } }));
            };

            return (
                <div className="bg-white border-b border-slate-200 animate-in">
                    <div className="max-w-6xl mx-auto p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                        {/* 01 Unit & Shape */}
                        <div className="space-y-4">
                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">01 Unit & Shape</label>
                            <div className="flex bg-slate-100 p-1 rounded-lg">
                                {[{id: UnitSystem.IMPERIAL, l:'Imperial'}, {id: UnitSystem.METRIC, l:'Metric'}].map(u => (
                                    <button key={u.id} onClick={() => set('unitSystem', u.id)} className={`flex-1 py-1.5 text-[10px] font-black rounded-md transition-all ${state.unitSystem === u.id ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500'}`}>{u.l}</button>
                                ))}
                            </div>
                            <div className="grid grid-cols-3 gap-2">
                                {[{id: RoofShape.GABLE, n:'Gable'}, {id: RoofShape.HIP, n:'Hip'}, {id: RoofShape.SHED, n:'Shed'}].map(s => (
                                    <button key={s.id} onClick={() => set('roofShape', s.id)} className={`flex flex-col items-center p-2 border rounded-xl ${state.roofShape === s.id ? 'border-blue-600 bg-blue-50' : 'border-slate-100 bg-slate-50'}`}>
                                        <span className={`text-[10px] font-black ${state.roofShape === s.id ? 'text-blue-700' : 'text-slate-500'}`}>{s.n}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 02 Dimensions */}
                        <div className="space-y-4 md:col-span-2">
                            <div className="flex justify-between items-center">
                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">02 Dimensions & Pitch</label>
                                <button onClick={() => set('useManualSlope', !state.useManualSlope)} className="text-[9px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded">
                                    {state.useManualSlope ? 'Estimate by Pitch' : 'Input Manual Slope Length'}
                                </button>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                {state.unitSystem === UnitSystem.IMPERIAL ? (
                                    <>
                                        <div className="space-y-1.5">
                                            <span className="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">Bldg Length (A)</span>
                                            <div className="flex gap-2">
                                                <div className="relative flex-1"><input type="number" value={state.length.feet} onChange={e => setDim('length','feet',e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-sm"/><span className="absolute right-2 top-2 text-[8px] text-slate-400">FT</span></div>
                                                <div className="relative flex-1"><input type="number" value={state.length.inches} onChange={e => setDim('length','inches',e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-sm"/><span className="absolute right-2 top-2 text-[8px] text-slate-400">IN</span></div>
                                            </div>
                                        </div>
                                        <div className="space-y-1.5">
                                            <span className="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">Bldg Width (B)</span>
                                            <div className="flex gap-2">
                                                <div className="relative flex-1"><input type="number" value={state.width.feet} onChange={e => setDim('width','feet',e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-sm"/><span className="absolute right-2 top-2 text-[8px] text-slate-400">FT</span></div>
                                                <div className="relative flex-1"><input type="number" value={state.width.inches} onChange={e => setDim('width','inches',e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-sm"/><span className="absolute right-2 top-2 text-[8px] text-slate-400">IN</span></div>
                                            </div>
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <div className="space-y-1.5"><span className="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">Bldg Length (A) m</span><input type="number" step="0.1" value={state.lengthMetric} onChange={e => set('lengthMetric', parseFloat(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
                                        <div className="space-y-1.5"><span className="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">Bldg Width (B) m</span><input type="number" step="0.1" value={state.widthMetric} onChange={e => set('widthMetric', parseFloat(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
                                    </>
                                )}
                            </div>
                            {!state.useManualSlope ? (
                                <div className="grid grid-cols-4 gap-2 pt-2">
                                    {Object.entries(PITCH_DATA).map(([key, d]) => (
                                        <button key={key} onClick={() => set('roofPitch', key)} className={`p-2 border rounded-lg text-[9px] font-black ${state.roofPitch === key ? 'border-blue-600 bg-blue-50 text-blue-700' : 'border-slate-100 bg-slate-50 text-slate-500'}`}>
                                            {d.label}
                                        </button>
                                    ))}
                                </div>
                            ) : (
                                <div className="pt-2">
                                    <span className="text-[10px] font-bold text-slate-500 uppercase">Manual Slope Length (SL)</span>
                                    {state.unitSystem === UnitSystem.IMPERIAL ? (
                                        <div className="flex gap-2 mt-1">
                                            <div className="relative flex-1"><input type="number" value={state.slopeLength.feet} onChange={e => setDim('slopeLength','feet',e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-sm font-bold"/><span className="absolute right-2 top-2 text-[8px] text-slate-400">FT</span></div>
                                            <div className="relative flex-1"><input type="number" value={state.slopeLength.inches} onChange={e => setDim('slopeLength','inches',e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-sm font-bold"/><span className="absolute right-2 top-2 text-[8px] text-slate-400">IN</span></div>
                                        </div>
                                    ) : (
                                        <input type="number" step="0.1" value={state.slopeLengthMetric} onChange={e => set('slopeLengthMetric', parseFloat(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-bold mt-1"/>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* 03 Quality & Labor */}
                        <div className="space-y-4">
                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">03 Quality & Labor</label>
                            <div className="space-y-3">
                                <div className="flex justify-between items-center"><span className="text-[10px] font-bold text-slate-700">Material Waste</span><span className="text-[10px] font-black text-blue-600">{state.wasteRate}%</span></div>
                                <input type="range" min="5" max="35" step="1" value={state.wasteRate} onChange={e => set('wasteRate', parseInt(e.target.value))} className="w-full h-1 bg-slate-100 rounded-full appearance-none accent-blue-600"/>
                            </div>
                            <div className="flex bg-slate-100 p-1 rounded-lg">
                                {['BASIC', 'STANDARD', 'PREMIUM'].map(g => (
                                    <button key={g} onClick={() => set('materialGrade', g)} className={`flex-1 py-1 text-[9px] font-black rounded-md ${state.materialGrade === g ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500'}`}>{g === 'BASIC' ? 'Eco' : g === 'STANDARD' ? 'Std' : 'Pro'}</button>
                                ))}
                            </div>
                            <div className="flex bg-slate-100 p-1 rounded-lg">
                                {['DIY', 'PROFESSIONAL'].map(t => (
                                    <button key={t} onClick={() => set('installationType', t)} className={`flex-1 py-1 text-[9px] font-black rounded-md ${state.installationType === t ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500'}`}>{t === 'DIY' ? 'DIY' : 'Pro Install'}</button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ result }) => (
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 animate-in">
                <div className="md:col-span-2 bg-white rounded-3xl p-8 border border-slate-200 card-shadow relative overflow-hidden flex flex-col justify-between">
                    <div className="absolute top-0 right-0 w-64 h-64 bg-blue-500/5 -mr-20 -mt-20 rounded-full blur-3xl"></div>
                    <div className="relative z-10">
                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Est. Total Project Cost</span>
                        <div className="text-6xl font-black text-slate-900 tracking-tighter mt-4">${Math.round(result.totalCost).toLocaleString()}</div>
                    </div>
                    <div className="grid grid-cols-2 gap-6 pt-6 border-t border-slate-100 mt-8 relative z-10">
                        <div><span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Price per sq.ft</span><p className="text-sm font-black text-blue-600">${result.pricePerSqFt.toFixed(2)}/sq.ft</p></div>
                        <div><span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Price per m²</span><p className="text-sm font-black text-slate-700">${result.pricePerSqM.toFixed(2)}/m²</p></div>
                    </div>
                </div>
                <div className="bg-white rounded-3xl p-6 border border-slate-200 card-shadow flex flex-col justify-between">
                    <span className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Net Roof Area</span>
                    <div>
                        <div className="text-4xl font-black text-slate-900 tracking-tight">{Math.round(result.baseArea).toLocaleString()} <span className="text-xs text-slate-300">sq.ft</span></div>
                        <p className="text-sm font-bold text-slate-400 italic">~ {Math.round(result.baseArea * SQFT_TO_SQM).toLocaleString()} m²</p>
                    </div>
                </div>
                <div className="bg-slate-900 rounded-3xl p-6 shadow-xl flex flex-col justify-between group">
                    <span className="text-[10px] font-black uppercase text-blue-400 tracking-widest">Order Quantity (Incl. Waste)</span>
                    <div>
                        <div className="text-4xl font-black text-white tracking-tight">{Math.round(result.matNeeded).toLocaleString()} <span className="text-xs text-slate-600">sq.ft</span></div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase mt-2">Qty = Net Area × (1 + Waste %)</p>
                    </div>
                </div>
            </div>
        );

        const BOMTable = ({ result, state, isUnlocked, onUnlock }) => {
            const [email, setEmail] = React.useState("");
            const [isSubmitting, setIsSubmitting] = React.useState(false);

            const matPrice = PRICING.MATERIAL[state.materialGrade];
            const laborPrice = state.installationType === 'PROFESSIONAL' ? (PRICING.LABOR.BASE + PRICING.LABOR.PREMIUMS[state.roofPitch]) : 0;
            const data = [
                {n: "Main Metal Panels", q: `${Math.round(result.matNeeded)} sq.ft`, p: `$${matPrice.toFixed(2)}`, t: `$${(result.matNeeded * matPrice).toFixed(2)}`, d: "Grade: " + state.materialGrade + " | Fluorocarbon Coating"},
                {n: "Installation Labor", q: `${Math.round(result.baseArea)} sq.ft`, p: `$${laborPrice.toFixed(2)}`, t: `$${(result.baseArea * laborPrice).toFixed(2)}`, d: state.installationType === 'DIY' ? "DIY / No Labor Cost" : "Includes high-altitude safety & insurance"},
                {n: "Accessories & Tax", q: "Lump Sum", p: "15% Base Rate", t: `$${result.accessoryCost.toFixed(2)}`, d: "Ridge caps, underlayment, screws, freight"}
            ];

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                
                // Formspree Integration
                try {
                    const response = await fetch("https://formspree.io/f/mgoyogde", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email: email, project_total: result.totalCost, material_needed: result.matNeeded })
                    });
                    
                    if (response.ok) {
                        onUnlock();
                    } else {
                        // Fallback unlock if service has issues
                        onUnlock();
                    }
                } catch (err) {
                    console.error("Submission failed", err);
                    onUnlock(); // Still unlock for user experience even if API fails
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="bg-white rounded-3xl border border-slate-200 card-shadow overflow-hidden animate-in relative">
                    <div className="bg-slate-900 px-6 py-4 text-white flex justify-between items-center">
                        <span className="text-[10px] font-black uppercase tracking-widest">Detailed Material List & BOM</span>
                        {!isUnlocked && <span className="text-[9px] bg-blue-600 px-2 py-0.5 rounded font-black animate-pulse uppercase">Locked</span>}
                    </div>
                    
                    <div className={`transition-all duration-700 ${!isUnlocked ? 'filter blur-md pointer-events-none select-none' : ''}`}>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left">
                                <thead className="bg-slate-50 text-[10px] text-slate-400 font-black uppercase tracking-widest border-b border-slate-100">
                                    <tr><th className="px-6 py-4">Category</th><th className="px-6 py-4">Quantity</th><th className="px-6 py-4">Unit Rate</th><th className="px-6 py-4 text-right">Subtotal</th></tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 text-sm">
                                    {data.map((d, i) => (
                                        <tr key={i} className="hover:bg-slate-50/50">
                                            <td className="px-6 py-5"><span className="font-black text-slate-800 block">{d.n}</span><span className="text-[10px] text-slate-400 font-medium">{d.d}</span></td>
                                            <td className="px-6 py-5 text-slate-600 font-bold">{d.q}</td>
                                            <td className="px-6 py-5 text-slate-600 font-bold">{d.p}</td>
                                            <td className="px-6 py-5 font-black text-slate-900 text-right">{d.t}</td>
                                        </tr>
                                    ))}
                                </tbody>
                                <tfoot className="bg-slate-50 border-t border-slate-100 font-black">
                                    <tr><td colSpan={3} className="px-6 py-5 text-slate-500 uppercase text-xs">Total Estimated Project Investment</td><td className="px-6 py-5 text-2xl text-blue-600 text-right">${Math.round(result.totalCost).toLocaleString()}</td></tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>

                    {!isUnlocked && (
                        <div className="absolute inset-0 flex items-center justify-center p-6 bg-white/20 z-20">
                            <div className="bg-white p-8 rounded-3xl shadow-2xl border border-slate-100 max-w-md w-full text-center animate-in">
                                <div className="blue-gradient w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white shadow-lg">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                                </div>
                                <h3 className="text-xl font-black text-slate-900 mb-2">Unlock Detailed Report</h3>
                                <p className="text-xs text-slate-500 font-medium mb-6">Enter your email to unlock the full material list and receive your quote comparison via email.</p>
                                
                                <form onSubmit={handleSubmit} className="space-y-3">
                                    <input 
                                        type="email" 
                                        required 
                                        name="email"
                                        placeholder="your@email.com" 
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold focus:ring-2 focus:ring-blue-600 outline-none transition-all"
                                    />
                                    <button 
                                        type="submit" 
                                        disabled={isSubmitting}
                                        className="w-full blue-gradient text-white font-black py-3 rounded-xl shadow-lg shadow-blue-200 hover:scale-[1.02] active:scale-[0.98] transition-all disabled:opacity-50"
                                    >
                                        {isSubmitting ? 'Unlocking...' : 'Unlock Material List'}
                                    </button>
                                </form>
                                <p className="text-[9px] text-slate-400 mt-4 uppercase font-bold tracking-widest">Secure & Professional Analysis</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SOPSection = () => (
            <div className="bg-white rounded-3xl p-8 md:p-10 border border-slate-200 card-shadow animate-in">
                <h3 className="text-xl font-black mb-8 flex items-center gap-3"><div className="w-1.5 h-6 bg-blue-600 rounded-full"></div>Standard Installation 6-Step SOP</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                    {[
                        {i: "01", t: "Measurement & Layout", d: "Measure actual slope length (SL). Create a layout plan to use full-length panels where possible to minimize horizontal seams."},
                        {i: "02", t: "Substrate Assessment", d: "Remove old materials and check the wood decking. Rotted wood won't hold screws; replace with 1/2' minimum plywood."},
                        {i: "03", t: "Synthetic Underlayment", d: "Install high-polymer underlayment from eaves up, overlapping at least 6 inches. This is the last line of defense against condensation."},
                        {i: "04" ,t: "Flashing & Trim", d: "Install Drip Edges and Gable Trims first. These components guide water into gutters and prevent wall-wicking."},
                        {i: "05", t: "Panel Installation", d: "Use dedicated screws with rubber washers. For Standing Seam systems, use hidden clips to allow thermal expansion."},
                        {i: "06", t: "Ventilation & Ridge Cap", d: "Finish with a Ridge Vent and Cap. Proper ventilation prevents condensation from rotting the internal wood structure."}
                    ].map(s => (
                        <div key={s.i} className="p-5 bg-slate-50 rounded-2xl border border-slate-100 hover:border-blue-300 transition-all group">
                            <span className="text-[10px] font-black text-blue-600 uppercase italic mb-2 block tracking-widest">Phase {s.i}</span>
                            <h4 className="text-base font-black text-slate-900 mb-2">{s.t}</h4>
                            <p className="text-[11px] text-slate-500 leading-relaxed font-medium">{s.d}</p>
                        </div>
                    ))}
                </div>
            </div>
        );

        const FAQSection = () => (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 animate-in">
                <div className="blue-gradient rounded-3xl p-8 text-white shadow-xl relative overflow-hidden group">
                    <h3 className="text-lg font-black mb-6 text-blue-200 uppercase tracking-widest">Frequently Asked Questions (FAQ)</h3>
                    <div className="space-y-6 relative z-10">
                        <div><h4 className="text-sm font-black mb-1">Q: Is it noisy during rain?</h4><p className="text-[11px] text-blue-100 opacity-80 leading-relaxed font-medium">Myth. Residential metal roofs installed on solid decking with underlayment are no louder than asphalt shingles.</p></div>
                        <div><h4 className="text-sm font-black mb-1">Q: Does it attract lightning?</h4><p className="text-[11px] text-blue-100 opacity-80 leading-relaxed font-medium">Height determines lightning strikes, not material. Metal is non-combustible, making it safer if struck.</p></div>
                        <div><h4 className="text-sm font-black mb-1">Q: Does it make the house hotter?</h4><p className="text-[11px] text-blue-100 opacity-80 leading-relaxed font-medium">Actually, it's cooler. Metal reflects 70%+ of solar heat, reducing indoor temps by 5-10 degrees vs asphalt shingles.</p></div>
                    </div>
                </div>
                <div className="bg-white rounded-3xl p-8 border border-slate-200 card-shadow">
                    <h3 className="text-lg font-black mb-6 flex items-center gap-2 font-black uppercase"><div className="w-1.5 h-6 bg-red-500 rounded-full"></div>Pro Tips & Common Pitfalls</h3>
                    <div className="space-y-4">
                        <div className="bg-red-50 p-4 rounded-2xl border border-red-100">
                            <h4 className="text-xs font-black text-red-700 mb-1">Trap: 29-Gauge Ultra-Thin Panels</h4>
                            <p className="text-[10px] text-red-600/80 leading-relaxed font-medium">Low quotes often use 0.3mm thin metal. Hail will dent it instantly. Demand 26-Gauge (0.48mm) minimum for residential.</p>
                        </div>
                        <div className="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                            <h4 className="text-xs font-black text-blue-700 mb-1">Standing Seam vs Exposed Fasteners</h4>
                            <p className="text-[10px] text-blue-600/80 leading-relaxed font-medium">Corrugated screws are exposed; washers perish in 10 years. Standing Seam hides all screws for 50 years of zero maintenance.</p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const DiagramSection = () => (
            <div className="bg-white p-8 rounded-3xl border border-slate-200 card-shadow grid grid-cols-1 sm:grid-cols-3 gap-6">
                <div className="text-xs"><span className="w-6 h-6 rounded-full bg-blue-100 flex items-center justify-center font-black text-blue-600 mb-3 text-[10px]">A</span><p className="font-black text-slate-800 mb-1 tracking-tight">Bldg Total Length (Length)</p><p className="text-slate-400 font-medium font-bold uppercase tracking-tight">Horizontal dist. of longest building edge.</p></div>
                <div className="text-xs"><span className="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center font-black text-slate-600 mb-3 text-[10px]">B</span><p className="font-black text-slate-800 mb-1 tracking-tight">Bldg Width (Width)</p><p className="text-slate-400 font-medium font-bold uppercase tracking-tight">Horizontal width of the building sides.</p></div>
                <div className="text-xs"><span className="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center font-black text-white mb-3 text-[10px]">SL</span><p className="font-black text-slate-800 mb-1 tracking-tight">Actual Slope Length (SL)</p><p className="text-slate-400 font-medium font-bold uppercase tracking-tight">Linear distance from ridge to eaves.</p></div>
            </div>
        );

        /** --- 3. Main Application --- **/

        const App = () => {
            const [isUnlocked, setIsUnlocked] = React.useState(false);
            const [state, setState] = React.useState({
                unitSystem: UnitSystem.IMPERIAL,
                length: { feet: 42, inches: 0 },
                width: { feet: 32, inches: 0 },
                lengthMetric: 12.8,
                widthMetric: 9.75,
                slopeLength: { feet: 18, inches: 0 },
                slopeLengthMetric: 5.5,
                useManualSlope: false,
                roofPitch: RoofPitch.STANDARD,
                roofShape: RoofShape.GABLE,
                materialGrade: MaterialGrade.STANDARD,
                installationType: InstallationType.PROFESSIONAL,
                wasteRate: 15,
            });

            const result = React.useMemo(() => {
                const toFt = (v) => (v.feet || 0) + ((v.inches || 0) / 12);
                const L = state.unitSystem === UnitSystem.IMPERIAL ? toFt(state.length) : state.lengthMetric * METERS_TO_FEET;
                const W = state.unitSystem === UnitSystem.IMPERIAL ? toFt(state.width) : state.widthMetric * METERS_TO_FEET;
                
                let baseArea = 0;
                if(state.useManualSlope) {
                    const sl = state.unitSystem === UnitSystem.IMPERIAL ? toFt(state.slopeLength) : state.slopeLengthMetric * METERS_TO_FEET;
                    baseArea = state.roofShape === RoofShape.SHED ? L * sl : L * sl * 2;
                } else {
                    const factor = PITCH_DATA[state.roofPitch].factor;
                    baseArea = L * W * factor;
                }
                
                const shapeWaste = state.roofShape === RoofShape.HIP ? 1.08 : 1.0;
                const matNeeded = baseArea * (1 + state.wasteRate / 100) * shapeWaste;
                
                const matPrice = PRICING.MATERIAL[state.materialGrade];
                const laborPrice = state.installationType === 'PROFESSIONAL' ? (PRICING.LABOR.BASE + PRICING.LABOR.PREMIUMS[state.roofPitch]) : 0;
                
                const matCost = matNeeded * matPrice;
                const laborCost = baseArea * laborPrice;
                const accessoryCost = (matCost + laborCost) * 0.15;
                const total = matCost + laborCost + accessoryCost;

                return {
                    totalCost: total,
                    baseArea,
                    matNeeded,
                    accessoryCost,
                    pricePerSqFt: baseArea > 0 ? total / baseArea : 0,
                    pricePerSqM: (baseArea * SQFT_TO_SQM) > 0 ? total / (baseArea * SQFT_TO_SQM) : 0
                };
            }, [state]);

            return (
                <div className="flex flex-col min-h-screen">
                    <Header />
                    <InputPanel state={state} setState={setState} />
                    <main className="flex-1 bg-slate-50/50 p-6 md:p-10">
                        <div className="max-w-6xl mx-auto space-y-12 pb-24">
                            <Dashboard result={result} />
                            <BOMTable 
                                result={result} 
                                state={state} 
                                isUnlocked={isUnlocked} 
                                onUnlock={() => setIsUnlocked(true)} 
                            />
                            <SOPSection />
                            <FAQSection />
                            <DiagramSection />
                            <div className="text-center pt-10 border-t border-slate-100">
                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-[0.3em]">RoofQuant Pro &copy; 2025 Professional Roofing Analysis</p>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
